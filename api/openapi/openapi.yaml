openapi: 3.1.0
info:
  title: Hublio API
  version: 1.0.0
  description: |
    Business Integration + Orchestration Platform API.

    Interactive docs (Scalar) are served at `/docs` in development.
servers:
  - url: http://localhost:8081
    description: Local
  - url: /api/v1
    description: Relative (when browsing via /docs)

tags:
  - name: System
  - name: Auth
  - name: Identity
  - name: Integration
  - name: Orchestration
  - name: Events
  - name: Machine

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: hublio-api

  /ready:
    get:
      tags: [System]
      summary: Readiness probe
      operationId: getReady
      security: []
      responses:
        "200":
          description: Dependencies OK
        "503":
          description: Degraded (Postgres/Redis)

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register organization + owner + default workspace
      operationId: authRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and issue JWT + refresh token (or an MFA challenge)
      description: >
        When the account has MFA enabled and the device is not trusted, no tokens are issued:
        `data` is `{ "mfa_required": true, "mfa_token": "..." }` and the client must call
        POST /api/v1/auth/mfa/verify. Otherwise `data` is `{ access_token, refresh_token, user }`.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in, or MFA challenge issued
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginSuccessEnvelope"
                  - $ref: "#/components/schemas/MFAChallengeEnvelope"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Complete an MFA login challenge
      description: >
        Consumes the challenge from POST /api/v1/auth/login and issues login tokens. Provide
        exactly one of `code` (TOTP) or `recovery_code` (single use). A challenge lives 5 minutes
        and allows 5 attempts.
      operationId: authMFAVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auth/mfa/status:
    get:
      tags: [Auth]
      summary: MFA enrollment status for the current user
      description: >
        Returns whether MFA is enabled or pending enrollment. Never includes secrets
        or recovery codes.
      operationId: authMFAStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: MFA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatusEnvelope"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Start TOTP enrollment for the current user
      description: >
        Provisions a TOTP secret (stored encrypted, `enabled_at` NULL) and 10 single-use recovery
        codes. The secret and recovery codes are returned in plaintext exactly once. MFA is not
        active until POST /api/v1/auth/mfa/enable succeeds.
      operationId: authMFASetup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enrollment started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetupEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auth/mfa/enable:
    post:
      tags: [Auth]
      summary: Enable MFA by confirming a TOTP code
      operationId: authMFAEnable
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAEnableRequest"
      responses:
        "200":
          description: MFA enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auth/mfa/disable:
    post:
      tags: [Auth]
      summary: Disable MFA after a password confirmation
      operationId: authMFADisable
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: MFA disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token
      operationId: authLogout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Logged out
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new access + refresh pair
      description: |
        Validates the refresh token in Redis, revokes it, and returns a new
        `access_token` + `refresh_token` (same shape as login success). Does not
        bump `last_login`. Access TTL remains 15 minutes; refresh TTL 7 days.
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Tokens rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user and organization (session bootstrap)
      description: |
        Returns the authenticated user and their organization. Requires Bearer JWT
        (or httpOnly cookie via Next BFF). Used by the web AuthProvider after
        session presence check so bootstrap does not rely on localStorage alone.
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user + organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeSuccessEnvelope"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      description: >
        Always returns a generic success response regardless of whether the email exists
        (anti-enumeration). When the email belongs to an active password user, a one-time reset
        link (valid for 1 hour) is emailed.
      operationId: authForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Generic success (never reveals if the email exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a one-time token
      operationId: authResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/auth/verify-email/request:
    post:
      tags: [Auth]
      summary: Request (or resend) a 6-digit email verification code
      description: >
        Always returns a generic success response (anti-enumeration). When the email belongs to a
        user whose email is not yet verified, a 6-digit code (valid for 15 minutes) is emailed.
      operationId: authRequestEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEmailVerificationRequest"
      responses:
        "200":
          description: Generic success (never reveals if the email exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email with a 6-digit code
      operationId: authVerifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/auth/oauth/providers:
    get:
      tags: [Auth]
      summary: List configured OAuth providers
      operationId: authOAuthProviders
      security: []
      responses:
        "200":
          description: Configured providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /api/v1/auth/oauth/callback:
    post:
      tags: [Auth]
      summary: Complete OAuth code exchange (hybrid login / onboarding)
      operationId: authOAuthCallback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCallbackRequest"
      responses:
        "200":
          description: Authenticated or onboarding required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/auth/oauth/onboarding:
    get:
      tags: [Auth]
      summary: Preview OAuth onboarding session
      operationId: authOAuthOnboardingPreview
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
        - name: X-OAuth-Onboarding-Token
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Onboarding preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/oauth/complete-registration:
    post:
      tags: [Auth]
      summary: Complete OAuth registration with Organization name
      operationId: authOAuthCompleteRegistration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCompleteRegistrationRequest"
      responses:
        "201":
          description: Registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/identity/organizations/{organizationId}:
    get:
      tags: [Identity]
      summary: Get organization
      operationId: getOrganization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/organizationId"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/identity/organizations/{organizationId}/suspend:
    post:
      tags: [Identity]
      summary: Suspend organization
      operationId: suspendOrganization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/organizationId"
      responses:
        "200":
          description: Suspended
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/identity/organizations/{organizationId}/activate:
    post:
      tags: [Identity]
      summary: Activate suspended organization
      operationId: activateOrganization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/organizationId"
      responses:
        "200":
          description: Activated

  /api/v1/identity/organizations/{organizationId}/workspaces:
    get:
      tags: [Identity]
      summary: List workspaces
      operationId: listWorkspaces
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/organizationId"
      responses:
        "200":
          description: Workspace list
    post:
      tags: [Identity]
      summary: Create workspace
      operationId: createWorkspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/organizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, environment]
              properties:
                name:
                  type: string
                environment:
                  type: string
                  example: production
      responses:
        "201":
          description: Workspace created

  /api/v1/identity/workspaces/{workspaceId}/enable:
    post:
      tags: [Identity]
      summary: Enable workspace
      operationId: enableWorkspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: Enabled

  /api/v1/identity/workspaces/{workspaceId}/disable:
    post:
      tags: [Identity]
      summary: Disable workspace
      operationId: disableWorkspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: Disabled

  /api/v1/identity/workspaces/{workspaceId}/members:
    get:
      tags: [Identity]
      summary: List workspace members
      operationId: listWorkspaceMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: Members (user_id, email, full_name, role, created_at)
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Identity]
      summary: Add user to workspace
      operationId: addWorkspaceMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [owner, admin, member]
      responses:
        "201":
          description: Member added

  /api/v1/identity/workspaces/{workspaceId}/api-keys:
    get:
      tags: [Identity]
      summary: List API keys
      operationId: listAPIKeys
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: API keys (never includes plaintext)
    post:
      tags: [Identity]
      summary: Create API key (plaintext returned once)
      operationId: createAPIKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created; includes plaintext once

  /api/v1/identity/workspaces/{workspaceId}/api-keys/{apiKeyId}/disable:
    post:
      tags: [Identity]
      summary: Disable API key
      operationId: disableAPIKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/apiKeyId"
      responses:
        "200":
          description: Disabled

  /api/v1/identity/workspaces/{workspaceId}/api-keys/{apiKeyId}/rotate:
    post:
      tags: [Identity]
      summary: Rotate API key (new plaintext once)
      operationId: rotateAPIKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/apiKeyId"
      responses:
        "200":
          description: Rotated

  /api/v1/integration/connectors:
    get:
      tags: [Integration]
      summary: List Connectors
      operationId: listConnectors
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connector list
    post:
      tags: [Integration]
      summary: Register a Connector (platform admin / seed)
      operationId: registerConnector
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterConnectorRequest"
      responses:
        "201":
          description: Connector registered
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/integration/connectors/{connectorId}:
    get:
      tags: [Integration]
      summary: Get Connector
      operationId: getConnector
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/connectorId"
      responses:
        "200":
          description: Connector
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/integration/connectors/{connectorId}/enable:
    post:
      tags: [Integration]
      summary: Enable Connector
      operationId: enableConnector
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/connectorId"
      responses:
        "200":
          description: Enabled
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/integration/connectors/{connectorId}/disable:
    post:
      tags: [Integration]
      summary: Disable Connector
      operationId: disableConnector
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/connectorId"
      responses:
        "200":
          description: Disabled
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/integration/connectors/{connectorId}/remove:
    post:
      tags: [Integration]
      summary: Remove Connector (terminal)
      operationId: removeConnector
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/connectorId"
      responses:
        "200":
          description: Removed
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/connections:
    get:
      tags: [Integration]
      summary: List Connections in a Workspace
      operationId: listConnections
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: Connection list
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Integration]
      summary: Create Connection (Draft) with initial Credential
      operationId: createConnection
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
      responses:
        "201":
          description: Connection created; credential never includes plaintext/ciphertext
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/connections/{connectionId}:
    get:
      tags: [Integration]
      summary: Get Connection
      operationId: getConnection
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/connectionId"
      responses:
        "200":
          description: Connection
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/connections/{connectionId}/verify:
    post:
      tags: [Integration]
      summary: Verify Connection (Draft/VerificationFailed -> Verifying -> Active|VerificationFailed)
      operationId: verifyConnection
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/connectionId"
      responses:
        "200":
          description: Verification finished (inspect status; active or verification_failed)
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/connections/{connectionId}/disable:
    post:
      tags: [Integration]
      summary: Disable Connection
      operationId: disableConnection
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/connectionId"
      responses:
        "200":
          description: Disabled
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/connections/{connectionId}/enable:
    post:
      tags: [Integration]
      summary: Enable Connection (must have been previously verified)
      operationId: enableConnection
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/connectionId"
      responses:
        "200":
          description: Enabled
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/connections/{connectionId}/credentials/rotate:
    post:
      tags: [Integration]
      summary: Rotate Credential (revokes previous, never returns secret)
      operationId: rotateCredential
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/connectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateCredentialRequest"
      responses:
        "201":
          description: Rotated; response never includes plaintext or ciphertext
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/sync-routes:
    get:
      tags: [Integration]
      summary: List SyncRoutes in a Workspace
      operationId: listSyncRoutes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      responses:
        "200":
          description: SyncRoute list (webhook_secret never included)
    post:
      tags: [Integration]
      summary: Create SyncRoute (Draft)
      description: |
        Workspace-scoped origin → destination fan-out configuration (not a Workflow).
        When trigger_type is webhook|both, generates a webhook secret; plaintext is returned
        once in the response as webhook_secret and never again (use rotate to re-issue).
      operationId: createSyncRoute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSyncRouteRequest"
      responses:
        "201":
          description: Created (may include webhook_secret once)
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/sync-routes/{syncRouteId}:
    get:
      tags: [Integration]
      summary: Get SyncRoute
      operationId: getSyncRoute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/syncRouteId"
      responses:
        "200":
          description: SyncRoute (has_webhook_secret flag; no plaintext)
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Integration]
      summary: Update SyncRoute (Draft or Disabled only)
      operationId: updateSyncRoute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/syncRouteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSyncRouteRequest"
      responses:
        "200":
          description: Updated
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Integration]
      summary: Soft-delete SyncRoute (must not be Enabled)
      operationId: deleteSyncRoute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/syncRouteId"
      responses:
        "200":
          description: Deleted
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/sync-routes/{syncRouteId}/enable:
    post:
      tags: [Integration]
      summary: Enable SyncRoute
      operationId: enableSyncRoute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/syncRouteId"
      responses:
        "200":
          description: Enabled
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/sync-routes/{syncRouteId}/disable:
    post:
      tags: [Integration]
      summary: Disable SyncRoute
      operationId: disableSyncRoute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/syncRouteId"
      responses:
        "200":
          description: Disabled
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/sync-routes/{syncRouteId}/webhook-secret/rotate:
    post:
      tags: [Integration]
      summary: Rotate SyncRoute webhook secret (plaintext once)
      operationId: rotateSyncRouteWebhookSecret
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/syncRouteId"
      responses:
        "200":
          description: Rotated; response includes webhook_secret once
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/integration/workspaces/{workspaceId}/sync-routes/{syncRouteId}/watermarks:
    get:
      tags: [Integration]
      summary: List poll watermarks for a SyncRoute
      operationId: listSyncRouteWatermarks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/syncRouteId"
      responses:
        "200":
          description: Watermark list

  /api/v1/integration/workspaces/{workspaceId}/sync-routes/{syncRouteId}/watermarks/{resourceType}:
    put:
      tags: [Integration]
      summary: Upsert poll watermark cursor
      operationId: upsertSyncRouteWatermark
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceId"
        - $ref: "#/components/parameters/syncRouteId"
        - name: resourceType
          in: path
          required: true
          schema:
            type: string
            example: invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cursor]
              properties:
                cursor:
                  type: object
                  additionalProperties: true
                  example:
                    last_updated_at: "2026-07-19T00:00:00Z"
                    last_record_id: "123"
      responses:
        "200":
          description: Upserted

  /api/v1/webhooks/sync-routes/{syncRouteId}:
    post:
      tags: [Orchestration]
      summary: Inbound SyncRoute webhook (shared-secret header)
      description: |
        Public ingress (no JWT / API key). Validates `X-Hublio-Webhook-Secret` against the
        SyncRoute encrypted secret (constant-time), checks Enabled + webhook|both trigger,
        resource_type allow-list, and optional JSON filter. On success submits a Business
        Intent bound to the SyncRoute source Connection and fans out to one Execution per
        activity step (sequential or parallel per group; optional reverse). Response includes
        `execution_id` (first) and `execution_ids` (all). Idempotency key may be supplied or
        is derived from workspace + route + resource + operation + business key. Never logs
        the webhook secret.
      operationId: acceptSyncRouteWebhook
      security: []
      parameters:
        - $ref: "#/components/parameters/syncRouteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptWebhookRequest"
      responses:
        "201":
          description: Intent created (or accepted)
        "200":
          description: Idempotent replay
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/sync-routes/{syncRouteId}/poll:
    post:
      tags: [Orchestration]
      summary: Run SyncRoute poll tick (watermark + list + Intent fan-out)
      description: |
        API Key ops/smoke endpoint. Pulls from the SyncRoute source Connection via list
        capability (default `invoice.list`) using the Postgres watermark cursor, filters
        each record, submits Intents with fan-out, then advances the watermark after a
        successful pull cycle (docs/30 §7.2). The worker also ticks Enabled schedule|both
        routes on `POLL_TICK_INTERVAL_SECONDS` (default 30s) via `integration.poll_sync_route`
        jobs. Destination Execution failures do not roll back the watermark.
      operationId: triggerSyncRoutePoll
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdHeader"
        - $ref: "#/components/parameters/syncRouteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type]
              properties:
                resource_type:
                  type: string
                  example: invoice
      responses:
        "200":
          description: Poll completed (may accept zero records)
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/intents:
    get:
      tags: [Orchestration]
      summary: List Intents (Workspace-scoped; API key or JWT + X-Workspace-ID)
      description: |
        Returns Intents for the Workspace, newest first. Payload is omitted on list
        responses (use getIntent for full detail). Optional status filter; limit defaults
        to 50 (max 200).
      operationId: listIntents
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdHeader"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [submitted, accepted, rejected, expired]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Intents (without payload)
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Orchestration]
      summary: Submit a Business Intent (Workspace-scoped; API key or JWT + X-Workspace-ID)
      description: |
        Resolves the Connection (must be Active), creates the Intent (Submitted), then
        Accepts or Rejects it based on payload/capability validity. On Accept, creates and
        Queues one Execution (direct submit) and enqueues the `orchestration.execution`
        worker job. SyncRoute webhook ingress may fan out to multiple Executions under the
        same Intent. Idempotency-Key is required; replays return the original Intent/Execution(s).
      operationId: submitIntent
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdHeader"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitIntentRequest"
      responses:
        "201":
          description: Intent submitted (created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "200":
          description: Idempotency-Key replay of a previously submitted Intent
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/intents/{intentId}:
    get:
      tags: [Orchestration]
      summary: Get Intent (tenant-scoped)
      operationId: getIntent
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdHeader"
        - $ref: "#/components/parameters/intentId"
      responses:
        "200":
          description: Intent
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/executions:
    get:
      tags: [Orchestration]
      summary: List Executions (Workspace-scoped via Intent join; API key or JWT + X-Workspace-ID)
      description: |
        Returns Executions belonging to Intents in the Workspace, newest first. Slim DTO
        (no steps/timeline). Optional status filter; limit defaults to 50 (max 200).
      operationId: listExecutions
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdHeader"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              [
                created,
                queued,
                running,
                succeeded,
                failed,
                cancelled,
                expired,
                dead_letter,
              ]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Executions (slim; no steps/timeline)
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/executions/{executionId}:
    get:
      tags: [Orchestration]
      summary: Get Execution (with Steps/Timeline; tenant-scoped)
      operationId: getExecution
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdHeader"
        - $ref: "#/components/parameters/executionId"
      responses:
        "200":
          description: Execution
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/executions/{executionId}/cancel:
    post:
      tags: [Orchestration]
      summary: Cancel a Queued/Running Execution (terminal)
      operationId: cancelExecution
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdHeader"
        - $ref: "#/components/parameters/executionId"
      responses:
        "200":
          description: Cancelled
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/executions/{executionId}/retry:
    post:
      tags: [Orchestration]
      summary: Manually retry a Failed Execution (Failed -> Queued)
      description: |
        Replay (new Execution for the same Intent) is deferred in v1: executions.intent_id is
        UNIQUE, so retry re-runs the same Execution row instead of creating a new one.
      operationId: retryExecution
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdHeader"
        - $ref: "#/components/parameters/executionId"
      responses:
        "200":
          description: Retry scheduled (re-enqueued)
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/executions/{executionId}/timeline:
    get:
      tags: [Orchestration]
      summary: Get Execution timeline (Observability, F3; tenant-scoped)
      description: |
        Focused view of the same execution_timelines rows already returned inline by
        GET /api/v1/executions/{executionId}.
      operationId: getExecutionTimeline
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdHeader"
        - $ref: "#/components/parameters/executionId"
      responses:
        "200":
          description: Execution timeline
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/events:
    get:
      tags: [Events]
      summary: List persisted Platform Events (Observability, F3; API key or JWT + X-Workspace-ID)
      description: |
        Append-only PlatformEvent facts (`events` table) published after a successful
        Identity/Integration/Orchestration commit. Never used to schedule work (Event
        Platform is not a work queue).
      operationId: listEvents
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/workspaceIdHeader"
        - name: execution_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Events
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/health:
    get:
      tags: [Machine]
      summary: Machine health (API key)
      operationId: machineHealth
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/platform/queue/health:
    post:
      tags: [Machine]
      summary: Enqueue platform.health job
      operationId: enqueuePlatformHealth
      security:
        - apiKeyAuth: []
      responses:
        "202":
          description: Accepted
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/platform/metrics:
    get:
      tags: [Machine]
      summary: Observability counters (Phase F, JSON; API key)
      description: |
        In-memory, per-process counters: executions_succeeded_total, executions_failed_total,
        events_published_total, audit_records_total, plus best-effort queue_depth (Redis LLEN).
        Same payload as GET /metrics (unauthenticated) for scrapers that expect that path.
      operationId: platformMetrics
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: Metrics snapshot
        "401":
          $ref: "#/components/responses/Error"

  /metrics:
    get:
      tags: [Machine]
      summary: Observability counters (Phase F, JSON; unauthenticated)
      operationId: metrics
      responses:
        "200":
          description: Metrics snapshot

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/v1/auth/login
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Workspace API key plaintext (prefix.secret)

  parameters:
    workspaceIdHeader:
      name: X-Workspace-ID
      in: header
      required: false
      description: |
        Required when authenticating with bearerAuth (user JWT).
        Ignored when using apiKeyAuth (workspace is implied by the key).
      schema:
        type: string
        format: uuid
    organizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    workspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    apiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    connectorId:
      name: connectorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    connectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    syncRouteId:
      name: syncRouteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    intentId:
      name: intentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    executionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
        data:
          description: Payload varies by endpoint

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          example: BAD_REQUEST
        detail:
          type: string

    RegisterRequest:
      type: object
      required: [organization_name, email, password, full_name]
      properties:
        organization_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
        workspace_name:
          type: string
          default: default
        environment:
          type: string
          default: production

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_id:
          type: string
          description: >
            Opaque client device identifier. When it matches a device previously trusted via
            POST /api/v1/auth/mfa/verify, the MFA challenge is skipped for 30 days.

    LoginSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [access_token, refresh_token, user]
              properties:
                access_token:
                  type: string
                refresh_token:
                  type: string
                user:
                  type: object

    MeSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [user, organization]
              properties:
                user:
                  $ref: "#/components/schemas/AuthUser"
                organization:
                  $ref: "#/components/schemas/AuthOrganization"

    AuthUser:
      type: object
      required: [id, organization_id, email, full_name, status]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        status:
          type: string
        is_platform_admin:
          type: boolean

    AuthOrganization:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MFAChallengeEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [mfa_required, mfa_token]
              properties:
                mfa_required:
                  type: boolean
                  const: true
                mfa_token:
                  type: string
                  description: Single-use challenge token, valid for 5 minutes

    MFAVerifyRequest:
      type: object
      required: [mfa_token]
      properties:
        mfa_token:
          type: string
        code:
          type: string
          description: 6-digit TOTP code (mutually exclusive with recovery_code)
        recovery_code:
          type: string
          description: Single-use recovery code, format xxxx-xxxx-xxxx
        device_id:
          type: string
        trust_device:
          type: boolean
          description: Remember device_id for 30 days so future logins skip the challenge

    MFAStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [enabled, pending_enrollment, remaining_recovery_codes, can_enroll]
              properties:
                enabled:
                  type: boolean
                pending_enrollment:
                  type: boolean
                  description: Secret provisioned but enable not confirmed yet
                remaining_recovery_codes:
                  type: integer
                can_enroll:
                  type: boolean
                  description: False for OAuth-only accounts (password required to enroll)

    MFASetupEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [secret, otpauth_url, recovery_codes]
              properties:
                secret:
                  type: string
                  description: Base32 TOTP secret (shown once)
                otpauth_url:
                  type: string
                  description: otpauth:// URL for QR enrollment (shown once)
                recovery_codes:
                  type: array
                  items:
                    type: string
                  description: Single-use recovery codes (shown once)
                warning:
                  type: string

    MFAEnableRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit TOTP code from the authenticator app

    MFADisableRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: One-time reset token from the emailed link
        password:
          type: string
          minLength: 8

    RequestEmailVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit numeric verification code

    OAuthCallbackRequest:
      type: object
      required: [provider, code, code_verifier, redirect_uri]
      properties:
        provider:
          type: string
          enum: [google, microsoft, github]
        code:
          type: string
        code_verifier:
          type: string
        redirect_uri:
          type: string
          format: uri

    OAuthCompleteRegistrationRequest:
      type: object
      required: [onboarding_token, organization_name]
      properties:
        onboarding_token:
          type: string
        organization_name:
          type: string
        workspace_name:
          type: string
          default: default
        environment:
          type: string
          default: production

    RegisterConnectorRequest:
      type: object
      required: [code, name, vendor, category, version]
      properties:
        code:
          type: string
          example: misa
          description: Built-in codes include fake, misa, nhanh (seeded on API boot).
        name:
          type: string
        vendor:
          type: string
        category:
          type: string
          enum: [source, destination, bidirectional, utility]
        version:
          type: string
          example: 1.0.0
        description:
          type: string
        homepage:
          type: string
        documentation_url:
          type: string
        capabilities:
          type: array
          items:
            type: object
            required: [code, display_name]
            properties:
              code:
                type: string
                example: invoice.create
              display_name:
                type: string
              is_async:
                type: boolean
                default: false

    CreateConnectionRequest:
      type: object
      required: [connector_id, name, environment, credential_type, secret]
      properties:
        connector_id:
          type: string
          format: uuid
        name:
          type: string
        is_default:
          type: boolean
          default: false
        description:
          type: string
        environment:
          type: string
          example: sandbox
        config:
          type: object
          description: |
            Provider-agnostic Connection config (JSONB). Examples:
            MISA — tax_code, inv_series, optional base_url (default testapi.meinvoice.vn/api/integration),
            optional sign_type (default 2);
            Nhanh — app_id, business_id, optional base_url (default pos.open.nhanh.vn/v3.0).
          example:
            tax_code: "0101243150"
            inv_series: "1C25TYY"
            base_url: "https://testapi.meinvoice.vn/api/integration"
        retry_policy:
          type: object
        timeout_seconds:
          type: integer
          default: 30
        credential_type:
          type: string
          enum: [api_key, oauth2, bearer_token, basic_auth, jwt]
        secret:
          type: object
          description: |
            Plaintext credential fields; encrypted at rest, never echoed back.
            MISA — app_id, username, password (tax_code may live here or in config);
            Nhanh — access_token.
          example:
            app_id: "your-misa-app-id"
            username: "user@example.com"
            password: "********"
        credential_expires_at:
          type: string
          format: date-time

    SubmitIntentRequest:
      type: object
      required: [connection_id, capability]
      properties:
        connection_id:
          type: string
          format: uuid
        capability:
          type: string
          example: invoice.create
          description: |
            Must match a capability on the Connection's Connector.
            MISA — invoice.create; Nhanh — invoice.get, invoice.update_status; Fake — echo.
        payload:
          type: object
          description: |
            Canonical-ish business payload (JSONB). For MISA invoice.create include at least
            invoice_number, issue_date, customer.name, and items[].
          example:
            invoice_number: "INV-100"
            issue_date: "2026-07-15T10:00:00Z"
            currency: VND
            customer:
              name: "Cong ty ABC"
              tax_code: "0300000000"
            items:
              - code: SKU-1
                name: "San pham 1"
                quantity: 2
                unit_price: 100000
                vat_rate: "10%"
            subtotal: 200000
            total: 220000
        correlation_id:
          type: string
          description: Defaults to the request's correlation id when omitted

    RotateCredentialRequest:
      type: object
      required: [credential_type, secret]
      properties:
        credential_type:
          type: string
          enum: [api_key, oauth2, bearer_token, basic_auth, jwt]
        secret:
          type: object
          description: Plaintext credential fields; encrypted at rest, never echoed back
        expires_at:
          type: string
          format: date-time

    CreateSyncRouteRequest:
      type: object
      required: [source_connection_id, name, trigger_type, resource_types, activities]
      properties:
        source_connection_id:
          type: string
          format: uuid
        name:
          type: string
          example: Nhanh to MISA invoices
        trigger_type:
          type: string
          enum: [webhook, schedule, both]
        resource_types:
          type: array
          items:
            type: string
          example: [invoice]
        schedule:
          type: object
          description: |
            Required when trigger_type is schedule|both. MVP key: interval_seconds (1..86400).
            Optional list_capability overrides the source pull capability (default invoice.list).
          example:
            interval_seconds: 300
            list_capability: invoice.list
        filter:
          type: object
          description: JSON condition tree (AND/OR); not a Rule Engine
        idempotency_rule:
          type: object
          example:
            rule: provider_triple
        activities:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SyncRouteActivityGroup"
        reverse:
          $ref: "#/components/schemas/SyncRouteReverse"
        retry_policy:
          type: object

    UpdateSyncRouteRequest:
      type: object
      properties:
        name:
          type: string
        source_connection_id:
          type: string
          format: uuid
        trigger_type:
          type: string
          enum: [webhook, schedule, both]
        resource_types:
          type: array
          items:
            type: string
        schedule:
          type: object
        filter:
          type: object
        idempotency_rule:
          type: object
        activities:
          type: array
          items:
            $ref: "#/components/schemas/SyncRouteActivityGroup"
        reverse:
          $ref: "#/components/schemas/SyncRouteReverse"
        clear_reverse:
          type: boolean
          default: false
        retry_policy:
          type: object

    SyncRouteActivityGroup:
      type: object
      required: [group_mode, steps]
      properties:
        group_mode:
          type: string
          enum: [sequential, parallel]
        steps:
          type: array
          minItems: 1
          items:
            type: object
            required: [destination_connection_id, capability]
            properties:
              destination_connection_id:
                type: string
                format: uuid
              capability:
                type: string
                example: invoice.create
              mapping_key:
                type: string

    SyncRouteReverse:
      type: object
      required: [capability]
      properties:
        capability:
          type: string
          example: invoice.update_status
        on:
          type: string
          enum: [success, failure, always]
          default: success

    AcceptWebhookRequest:
      type: object
      required: [resource_type, payload]
      properties:
        resource_type:
          type: string
          example: invoice
        operation:
          type: string
          description: Defaults to upsert; used in derived idempotency key
          example: create
        payload:
          type: object
          description: Canonical-ish business payload for the Intent
          additionalProperties: true
          example:
            invoice_number: "INV-100"
            issue_date: "2026-07-15T10:00:00Z"
            currency: VND
            customer:
              name: "Cong ty ABC"
            items:
              - name: "San pham 1"
                quantity: 1
                unit_price: 100000
        idempotency_key:
          type: string
          description: Optional; when omitted Hublio derives a stable key
        correlation_id:
          type: string
